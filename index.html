      // Intercept and suppress benign Vite WebSocket disconnection events to keep error monitors clean.
      (function() {
        window.addEventListener('error', function(event) {
          if (
            event &&
            ((event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('vite') !== -1)) ||
             (event.error && event.error.message && (event.error.message.indexOf('WebSocket') !== -1 || event.error.message.indexOf('vite') !== -1)))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
